<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Verificador de Acesso</title>
    <style>
        body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f0f0; margin: 0; }
        .caixa { background: white; padding: 40px; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
        .info { font-size: 1.1rem; color: #2c3e50; margin: 8px 0; }
        .info .dado { color: #f7971e; font-weight: bold; }
        .resultado { font-size: 1.5rem; font-weight: bold; margin-top: 15px; padding: 15px; border-radius: 10px; }
        .resultado.liberado { background: #d4edda; color: #28a745; border: 2px solid #28a745; }
        .resultado.liberado::before { content: "✅ "; }
        .resultado.bloqueado { background: #f8d7da; color: #dc3545; border: 2px solid #dc3545; }
        .resultado.bloqueado::before { content: "❌ "; }
        h1 { color: #1a1a2e; }
    </style>
</head>
<body>
    <div class="caixa">
        <h1>🚦 Verificador de Acesso</h1>
        <div class="info">Idade: <span class="dado" id="idadeInfo"></span></div>
        <div class="info">Possui Carteira: <span class="dado" id="carteiraInfo"></span></div>
        <div id="resultadoAcesso" class="resultado"></div>
    </div>

    <script>
        // ============================================================
        // DESAFIO: Verifique se a pessoa pode dirigir
        // Regra: idade >= 18 E temCarteira == true → "liberado"
        //        senão → "bloqueado"
        // ============================================================

        let idade = 18;
        let temCarteira = true;

        document.getElementById("idadeInfo").textContent = idade;
        document.getElementById("carteiraInfo").textContent = temCarteira ? "Sim" : "Não";

        // ⬇️ ELEMENTO JÁ CAPTURADO ⬇️
        let resultado = document.getElementById("resultadoAcesso");

        // ⬇️ COMPLETE A LÓGICA AQUI ⬇️
       
        let podeDirigir = idade >= 18 && temCarteira === true;
        let status = podeDirigir ? "liberado" : "bloqueado";

        resultado.textContent = status;
        resultado.className = "resultado " + status;
        
        
        // ⬆️ COMPLETE A LÓGICA AQUI ⬆️
    </script>
</body>
</html>
